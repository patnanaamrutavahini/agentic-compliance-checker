services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://compliance:compliance@postgres:5432/compliance
      REDIS_URL: redis://redis:6379/0
      USE_IN_MEMORY_REDIS: "false"
      VECTOR_BACKEND: chroma
      CHROMA_PERSIST_DIR: /app/chroma_data
      DEFAULT_LLM_PROVIDER: mock
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - uploads:/app/uploads
      - chroma:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  chroma:
